<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kroma Lab | Impresión UV DTF Industrial en Guatemala</title>
  <meta name="description" content="Kroma Lab — Cotizador en línea de impresión UV DTF industrial por metro lineal en Guatemala. Adherencia permanente, relieve táctil y barniz brillante.">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./src/css/theme.css">
  <link rel="stylesheet" href="./src/css/base.css">
  <link rel="stylesheet" href="./src/css/views.css">
  <script>
    window.__KROMA_API_URL__ = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
      ? 'http://localhost:4000/api'
      : 'https://kroma-lab-backend-216908488828.us-central1.run.app/api';
  </script>
</head>
<body>
  <!-- Contenedor Aislado Exclusivo para Impresión y Generación de PDF -->
  <div id="printContainer" class="print-container" aria-hidden="true"></div>

  <!-- ==========================================================================
       BARRA DE NAVEGACIÓN SUPERIOR (TOPBAR DESPEJADA CON ACCIONES GLOBALES)
       ========================================================================== -->
  <header class="navbar">
    <div class="container navbar-container">
      
      <!-- Lado Izquierdo: Botón Hamburguesa + Logo Oficial Vectorial Kroma Lab -->
      <div style="display: flex; align-items: center; gap: 0.85rem;">
        <!-- Botón para alternar el Menú Lateral (Sidebar Drawer) -->
        <button id="mobileNavToggle" class="sidebar-toggle-btn" aria-label="Abrir menú de navegación" aria-expanded="false" title="Menú de Navegación">
          <span id="mobileNavIcon">☰</span>
        </button>

        <a href="/" class="brand-logo" id="mainBrandLogo" aria-label="Kroma Lab" data-link>
        <div class="logo-svg-wrap">
          <svg viewBox="95 85 810 705" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="nav-top-outer" x1="305" y1="97" x2="695" y2="97" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#E12526" />
                <stop offset="50%" stop-color="#EE6B24" />
                <stop offset="100%" stop-color="#F5CA28" />
              </linearGradient>
              <linearGradient id="nav-top-inner" x1="372" y1="213" x2="695" y2="155" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#B92A25" />
                <stop offset="55%" stop-color="#C96B1D" />
                <stop offset="100%" stop-color="#D4941A" />
              </linearGradient>
              <linearGradient id="nav-tr-outer" x1="695" y1="97" x2="890" y2="435" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#EDAE1F" />
                <stop offset="55%" stop-color="#A5C626" />
                <stop offset="100%" stop-color="#199B49" />
              </linearGradient>
              <linearGradient id="nav-tr-inner" x1="628" y1="213" x2="890" y2="435" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#6B9832" />
                <stop offset="60%" stop-color="#228640" />
                <stop offset="100%" stop-color="#0B7B42" />
              </linearGradient>
              <linearGradient id="nav-br-outer" x1="890" y1="435" x2="695" y2="773" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#0C9653" />
                <stop offset="50%" stop-color="#14A88B" />
                <stop offset="100%" stop-color="#208AD8" />
              </linearGradient>
              <linearGradient id="nav-br-inner" x1="756" y1="435" x2="628" y2="657" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#1AB37C" />
                <stop offset="55%" stop-color="#2FC6C6" />
                <stop offset="100%" stop-color="#239FE0" />
              </linearGradient>
              <linearGradient id="nav-bot-inner" x1="695" y1="773" x2="372" y2="657" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#1978CE" />
                <stop offset="60%" stop-color="#1746C4" />
                <stop offset="100%" stop-color="#2729B8" />
              </linearGradient>
              <linearGradient id="nav-bot-outer" x1="695" y1="773" x2="305" y2="773" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#2994E2" />
                <stop offset="45%" stop-color="#1B32B8" />
                <stop offset="100%" stop-color="#5D27E1" />
              </linearGradient>
              <linearGradient id="nav-bl-outer" x1="305" y1="773" x2="110" y2="435" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#3C16BA" />
                <stop offset="50%" stop-color="#8719D6" />
                <stop offset="100%" stop-color="#D721C8" />
              </linearGradient>
              <linearGradient id="nav-bl-inner" x1="372" y1="657" x2="177" y2="435" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#5922DC" />
                <stop offset="50%" stop-color="#A624E8" />
                <stop offset="100%" stop-color="#EC2CE8" />
              </linearGradient>
              <linearGradient id="nav-tl-outer" x1="110" y1="435" x2="305" y2="97" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#CA1F96" />
                <stop offset="55%" stop-color="#DF2758" />
                <stop offset="100%" stop-color="#E52726" />
              </linearGradient>
              <linearGradient id="nav-tl-inner" x1="244" y1="435" x2="338" y2="155" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#9A1B64" />
                <stop offset="55%" stop-color="#BA1F38" />
                <stop offset="100%" stop-color="#C92123" />
              </linearGradient>
            </defs>
            <!-- Anillo Hexagonal Facetado 3D -->
            <g stroke-linejoin="bevel">
              <polygon points="305,97.25 695,97.25 372,213.3" fill="url(#nav-top-outer)" stroke="url(#nav-top-outer)" stroke-width="1" />
              <polygon points="372,213.3 695,97.25 628,213.3" fill="url(#nav-top-inner)" stroke="url(#nav-top-inner)" stroke-width="1" />
              <polygon points="695,97.25 890,435 628,213.3" fill="url(#nav-tr-outer)" stroke="url(#nav-tr-outer)" stroke-width="1" />
              <polygon points="628,213.3 890,435 756,435" fill="url(#nav-tr-inner)" stroke="url(#nav-tr-inner)" stroke-width="1" />
              <polygon points="890,435 695,772.75 756,435" fill="url(#nav-br-outer)" stroke="url(#nav-br-outer)" stroke-width="1" />
              <polygon points="756,435 695,772.75 628,656.7" fill="url(#nav-br-inner)" stroke="url(#nav-br-inner)" stroke-width="1" />
              <polygon points="628,656.7 695,772.75 372,656.7" fill="url(#nav-bot-inner)" stroke="url(#nav-bot-inner)" stroke-width="1" />
              <polygon points="695,772.75 305,772.75 372,656.7" fill="url(#nav-bot-outer)" stroke="url(#nav-bot-outer)" stroke-width="1" />
              <polygon points="305,772.75 110,435 372,656.7" fill="url(#nav-bl-outer)" stroke="url(#nav-bl-outer)" stroke-width="1" />
              <polygon points="372,656.7 110,435 244,435" fill="url(#nav-bl-inner)" stroke="url(#nav-bl-inner)" stroke-width="1" />
              <polygon points="110,435 305,97.25 244,435" fill="url(#nav-tl-outer)" stroke="url(#nav-tl-outer)" stroke-width="1" />
              <polygon points="244,435 305,97.25 372,213.3" fill="url(#nav-tl-inner)" stroke="url(#nav-tl-inner)" stroke-width="1" />
            </g>
            <!-- Monograma KL -->
            <g fill="var(--logo-monogram)">
              <path d="M 345 326 L 345 544 L 391 544 L 391 461 L 391.06055 461 L 391 460.98242 L 412.40234 418 L 391 418 L 391 326 L 345 326 z M 474 326 L 418.2832 417.5332 L 418.3457 417.57031 L 392.44336 461 L 418 461 L 475 544 L 528 544 L 452 438 L 525 326 L 474 326 z " />
              <path d="M 542,326 H 588 V 502 L 542,541 Z" />
              <path d="M 547,544 L 597,504 H 691 L 669,544 Z" />
            </g>
          </svg>
        </div>

        <!-- Nombre de Marca con 'Sales Studio' condicional por rol -->
        <div class="brand-name">
          <span class="brand-title">KROMA <span style="font-weight: 500;">LAB</span></span>
          <!-- Solo visible para ADMIN y EMPLOYEE; oculto para Clientes y Visitantes -->
          <span id="salesStudioTag" class="brand-tag" style="display: none;">Sales Studio</span>
        </div>
      </a>
      </div>

      <!-- Lado Derecho: Acciones Globales del Topbar -->
      <div class="navbar-actions-group">
        <!-- Botón de Carrito de Compras -->
        <button id="cartToggleBtn" class="cart-toggle-btn" aria-label="Ver Carrito de Compras" title="Carrito de Compras">
          <span style="font-size: 1.2rem;">🛒</span>
          <span id="cartCountBadge" class="cart-count-badge" style="display: none;">0</span>
        </button>

        <!-- Chip de Perfil de Usuario -->
        <div id="userProfileChip" class="user-profile-chip" title="Perfil y Rol Activo">
          <span class="user-chip-avatar" id="userChipAvatar">👤</span>
          <span class="user-chip-name" id="userChipName">Admin</span>
        </div>

        <!-- Botón Switch Modo Claro / Oscuro -->
        <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="Cambiar tema" title="Modo Claro / Oscuro">
          <span id="themeToggleIcon">☀️</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ==========================================================================
       SIDEBAR DRAWER: MENÚ LATERAL COLAPSABLE CATEGORIZADO
       ========================================================================== -->
  <div id="sidebarBackdrop" class="sidebar-backdrop" aria-hidden="true"></div>

  <aside id="appSidebar" class="app-sidebar" aria-label="Navegación Principal" aria-hidden="true">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <span class="sidebar-brand-title">KROMA <strong>LAB</strong></span>
        <span class="sidebar-brand-badge">Sales Studio UV DTF</span>
      </div>
      <button id="sidebarCloseBtn" class="sidebar-close-btn" aria-label="Cerrar menú lateral" title="Cerrar menú">
        ✕
      </button>
    </div>

    <!-- Contenedor Reactivo de Enlaces por Rol (#navRoleLinks) -->
    <nav id="navRoleLinks" class="nav-role-links">
      <!-- Se inyecta dinámicamente según el rol en app.js -->
    </nav>

    <!-- Footer del Sidebar con información de usuario -->
    <div class="sidebar-footer">
      <div class="sidebar-user-card" id="sidebarUserCard">
        <div class="sidebar-user-avatar" id="sidebarUserAvatar">M</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="sidebarUserName">Miguel Dubois</div>
          <div class="sidebar-user-role" id="sidebarUserRole">ADMINISTRADOR</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Contenedores para Modales y Drawers Globales -->
  <div id="cartDrawerContainer"></div>
  <div id="checkoutModalContainer"></div>
  <div id="userProfileModalContainer"></div>
  <div id="saveQuoteModalContainer"></div>

  <!-- ==========================================================================
       CONTENIDO PRINCIPAL: VISTAS MONTADAS POR EL ENRUTADOR SPA (#app)
       ========================================================================== -->
  <main id="app" class="container" style="min-height: 70vh;">
    <!-- Vista inyectada dinámicamente por router.js -->
  </main>

  <script>
    // Configuración dinámica de API Backend:
    // En entorno local utiliza el puerto 4000; en producción en la nube (Cloudflare Pages),
    // se conecta al servicio web desplegado en Render o al dominio configurado.
    window.__KROMA_API_URL__ = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
      ? 'http://localhost:4000/api'
      : (window.__KROMA_API_PROD_URL__ || 'https://kroma-lab-sales-studio-backend.onrender.com/api');
  </script>
  <script type="module" src="./src/js/app.js"></script>
</body>
</html>
